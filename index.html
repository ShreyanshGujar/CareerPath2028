<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚡ Career Path 2028</title>
<meta name="theme-color" content="#070b16" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CP2028" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{
  --bg:#070b16; --bg2:#0d1425; --card:rgba(255,255,255,.045); --card-brd:rgba(255,255,255,.09);
  --txt:#eaf0ff; --muted:#8b97b5; --accent:#6c8cff;
  --jee:#ff4757; --cet:#2ed573; --board:#3d7bff;
  --red:#ff4757; --yellow:#ffb02e; --green:#2ed573;
  --glass:blur(16px); --radius:20px; --shadow:0 18px 50px rgba(0,0,0,.5);
  --font-h:'Sora',sans-serif; --font-b:'Manrope',sans-serif;
}
[data-theme="light"]{
  --bg:#eef2fb; --bg2:#ffffff; --card:rgba(255,255,255,.75); --card-brd:rgba(20,30,60,.09);
  --txt:#141a2e; --muted:#5a6684; --accent:#3a5bff; --shadow:0 18px 45px rgba(60,80,160,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-b);background:var(--bg);color:var(--txt);overflow-x:hidden;transition:background .5s,color .3s}
h1,h2,h3,h4,.h{font-family:var(--font-h);letter-spacing:-.02em}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
#confetti{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none}
.wrap{position:relative;z-index:2}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}
.hide{display:none!important}

/* THEME TOGGLE */
#themeToggle{position:fixed;bottom:22px;left:22px;z-index:50;width:48px;height:48px;border-radius:50%;
  background:var(--card);border:1px solid var(--card-brd);backdrop-filter:var(--glass);font-size:19px;
  display:flex;align-items:center;justify-content:center;transition:transform .3s,background .3s;box-shadow:var(--shadow)}
#themeToggle:hover{transform:rotate(25deg) scale(1.08)}
#installBtn{position:fixed;top:18px;right:78px;z-index:50;height:48px;padding:0 18px;border-radius:24px;background:var(--accent);color:#fff;font-weight:700;font-size:.88rem;box-shadow:0 8px 22px rgba(60,91,255,.4);display:flex;align-items:center;gap:8px}
#installBtn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.landing-logo{width:104px;height:104px;border-radius:26px;margin-bottom:20px;box-shadow:var(--shadow);animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-mini{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:7px}

/* LANDING */
#landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.brand{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;text-align:center;line-height:1.05;
  background:linear-gradient(100deg,#7aa2ff,#c56bff 45%,#ff6b9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);margin-top:14px;font-size:clamp(.95rem,2.5vw,1.15rem);text-align:center;max-width:560px}
.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:56px;width:100%;max-width:920px}
@media(max-width:760px){.exam-grid{grid-template-columns:1fr}}
.exam-card{position:relative;background:var(--card);border:1px solid var(--card-brd);backdrop-filter:var(--glass);
  border-radius:24px;padding:42px 26px;text-align:center;transition:transform .35s,box-shadow .35s,border-color .35s;overflow:hidden}
.exam-card:hover{transform:translateY(-10px)}
.exam-card .ico{font-size:3rem;margin-bottom:18px;transition:transform .35s}
.exam-card:hover .ico{transform:scale(1.15)}
.exam-card h3{font-size:1.5rem;margin-bottom:8px}
.exam-card p{color:var(--muted);font-size:.9rem}
.exam-card .go{margin-top:20px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;opacity:.85}
.exam-card[data-exam="JEE"]:hover{box-shadow:0 0 0 1px var(--jee),0 22px 60px rgba(255,71,87,.35);border-color:var(--jee)}
.exam-card[data-exam="CET"]:hover{box-shadow:0 0 0 1px var(--cet),0 22px 60px rgba(46,213,115,.35);border-color:var(--cet)}
.exam-card[data-exam="Boards"]:hover{box-shadow:0 0 0 1px var(--board),0 22px 60px rgba(61,123,255,.35);border-color:var(--board)}
.exam-card[data-exam="JEE"] .ico{color:var(--jee)} .exam-card[data-exam="CET"] .ico{color:var(--cet)} .exam-card[data-exam="Boards"] .ico{color:var(--board)}

/* AUTH */
#authScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{background:var(--card);border:1px solid var(--card-brd);backdrop-filter:var(--glass);border-radius:24px;padding:32px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;gap:8px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:10px;border-radius:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--card-brd)}
.auth-tabs button.active{background:var(--accent);color:#fff;border-color:transparent}
.auth-err{color:#ff6b78;font-size:.82rem;margin-top:10px;min-height:18px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--card-brd);font-size:.82rem;font-weight:600;white-space:nowrap;max-width:190px;overflow:hidden}
.user-chip span{overflow:hidden;text-overflow:ellipsis}

/* APP SHELL */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:14px 22px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--card-brd)}
.logo{font-family:var(--font-h);font-weight:800;font-size:1.15rem;white-space:nowrap;cursor:pointer}
.nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{padding:9px 15px;border-radius:12px;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap;transition:.25s}
.nav button:hover{color:var(--txt);background:var(--card)}
.nav button.active{color:var(--txt);background:var(--card);box-shadow:inset 0 0 0 1px var(--card-brd)}
.exam-pill{padding:7px 13px;border-radius:20px;font-weight:700;font-size:.8rem;white-space:nowrap;border:1px solid var(--card-brd);background:var(--card)}
.container{max-width:1140px;margin:0 auto;padding:26px 22px 90px}
.view{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-title{font-size:1.7rem;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);margin-bottom:24px;font-size:.92rem}

/* CARDS */
.card{background:var(--card);border:1px solid var(--card-brd);backdrop-filter:var(--glass);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-num{font-size:2rem;font-weight:800;font-family:var(--font-h);margin-top:6px}

/* COUNTDOWN */
.countdown{text-align:center;padding:34px}
.cd-days{font-family:var(--font-h);font-weight:800;font-size:clamp(3rem,10vw,5.5rem);line-height:1;
  background:linear-gradient(120deg,#7aa2ff,#ff6b9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cd-sub{color:var(--muted);margin-top:8px}
.cd-tent{margin-top:6px;font-weight:600}

/* PROGRESS BAR */
.bar{height:16px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar>span{display:block;height:100%;border-radius:20px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.progwrap{transition:transform .25s}.progwrap:hover{transform:scale(1.015)}
.pct{font-weight:800;font-family:var(--font-h)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;
  background:var(--accent);color:#fff;transition:transform .2s,filter .2s,box-shadow .2s;box-shadow:0 8px 22px rgba(60,91,255,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--card-brd);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:.8rem;box-shadow:none}
.btn.danger{background:var(--red);box-shadow:none}
.btn.ok{background:var(--green);box-shadow:none}

/* INPUTS */
input,select,textarea{width:100%;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--card-brd);color:var(--txt);font-family:var(--font-b);font-size:.9rem;transition:.2s}
[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:rgba(255,255,255,.7)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
option{background:var(--bg2);color:var(--txt)}
.field{margin-bottom:14px}.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* SYLLABUS */
.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{padding:8px 15px;border-radius:20px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--card-brd);color:var(--muted)}
.subtabs button.active{color:#fff;background:var(--accent);border-color:transparent}
.chap{background:var(--card);border:1px solid var(--card-brd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.chap-head{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer}
.chap-head .nm{flex:1;font-weight:600}
.chap-head .mini{width:120px}
.chap-body{padding:0 18px 16px;display:none}
.chap.open .chap-body{display:block}
.chap.open .chap-head .chev{transform:rotate(90deg)}
.chev{transition:.3s;color:var(--muted)}
.topic{padding:12px 0;border-top:1px dashed var(--card-brd)}
.topic .tn{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted);cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.chk.on{color:var(--txt)}

/* TABS (revision/study) */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border-radius:12px;font-weight:600;background:var(--card);border:1px solid var(--card-brd);color:var(--muted)}
.tabs button.active{color:var(--txt);background:var(--accent);border-color:transparent;color:#fff}

/* LIST ITEM */
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:10px;border:1px solid var(--card-brd)}
.li .grow{flex:1}
.li small{color:var(--muted)}
.tag{padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700}
.tag.due{background:rgba(255,71,87,.15);color:#ff6b78}
.tag.up{background:rgba(255,176,46,.15);color:#ffb02e}
.tag.done{background:rgba(46,213,115,.15);color:#2ed573}

/* TIMER */
.timer-face{font-family:var(--font-h);font-weight:800;font-size:clamp(3.5rem,14vw,7rem);text-align:center;letter-spacing:-.03em}
.mode-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.mode-btns button{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-brd);font-weight:600;font-size:.84rem;color:var(--muted)}
.mode-btns button.active{background:var(--accent);color:#fff;border-color:transparent}

/* CHAT */
.chat-box{height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:.9rem;line-height:1.5;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--card-brd);border-bottom-left-radius:4px}

/* CHART */
.chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding-top:20px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .bar-v{width:100%;max-width:52px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--accent),#8a5bff);transition:height .8s;position:relative}
.chart .bar-v span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:.78rem;font-weight:700}
.chart .cl{font-size:.74rem;color:var(--muted);text-align:center}

/* HEATMAP */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cell{padding:12px;border-radius:12px;cursor:pointer;font-size:.82rem;font-weight:600;color:#fff;transition:transform .2s;min-height:64px;display:flex;flex-direction:column;justify-content:space-between}
.cell:hover{transform:scale(1.05)}
.cell small{opacity:.85;font-weight:500}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(2,5,15,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--card-brd);border-radius:20px;max-width:520px;width:100%;padding:26px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal .x{font-size:1.4rem;color:var(--muted);cursor:pointer}

/* FILE MANAGER */
.folder{border:1px solid var(--card-brd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.folder-h{padding:12px 15px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.03)}
.file-row{display:flex;align-items:center;gap:10px;padding:9px 15px 9px 34px;font-size:.86rem;border-top:1px solid var(--card-brd)}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);z-index:500;
  background:var(--bg2);border:1px solid var(--card-brd);padding:13px 20px;border-radius:14px;box-shadow:var(--shadow);
  font-weight:600;font-size:.9rem;transition:transform .4s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body data-theme="dark">
<canvas id="particles"></canvas>
<canvas id="confetti"></canvas>
<button id="themeToggle" title="Toggle theme">🌙</button>
<button id="installBtn" class="hide" title="Install as app"><i class="fa-solid fa-download"></i> Install</button>

<!-- LANDING -->
<div id="landing" class="wrap">
  <img src="icon-192.png" alt="Career Path 2028 logo" class="landing-logo" onerror="this.style.display='none'" />
  <h1 class="brand">⚡ Career Path 2028</h1>
  <p class="sub">Your personal command center for JEE, CET & 12th Boards. Track syllabus, revisions, tests and study time — all in one place.</p>
  <div class="exam-grid">
    <button class="exam-card" data-exam="JEE"><div class="ico"><i class="fa-solid fa-atom"></i></div><h3>JEE</h3><p>Mains & Advanced</p><span class="go">Enter <i class="fa-solid fa-arrow-right"></i></span></button>
    <button class="exam-card" data-exam="CET"><div class="ico"><i class="fa-solid fa-flask-vial"></i></div><h3>CET</h3><p>State entrance</p><span class="go">Enter <i class="fa-solid fa-arrow-right"></i></span></button>
    <button class="exam-card" data-exam="Boards"><div class="ico"><i class="fa-solid fa-graduation-cap"></i></div><h3>12th Boards</h3><p>Class 12 finals</p><span class="go">Enter <i class="fa-solid fa-arrow-right"></i></span></button>
  </div>
</div>

<!-- AUTH -->
<div id="authScreen" class="wrap hide">
  <img src="icon-192.png" alt="logo" class="landing-logo" onerror="this.style.display='none'" style="width:84px;height:84px" />
  <h1 class="brand" style="font-size:clamp(2rem,6vw,3.2rem)">⚡ Career Path 2028</h1>
  <p class="sub" style="margin-bottom:26px">Sign in to sync your progress across all your devices</p>
  <div class="auth-card">
    <div class="auth-tabs"><button id="tabLogin" class="active" onclick="switchAuth('login')">Log In</button><button id="tabSignup" onclick="switchAuth('signup')">Sign Up</button></div>
    <div class="field" id="unameField" style="display:none"><label>Username</label><input id="auName" placeholder="Your name" autocomplete="name"></div>
    <div class="field"><label>Email</label><input id="auEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="auPass" type="password" placeholder="At least 6 characters" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitAuth()"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="submitAuth()" id="auBtn"><i class="fa-solid fa-right-to-bracket"></i> Log In</button>
    <div class="auth-err" id="auErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hide">
  <div class="topbar">
    <div class="logo" onclick="goLanding()"><img src="icon-192.png" class="logo-mini" onerror="this.style.display='none'">CP<span style="color:var(--accent)">2028</span></div>
    <div class="nav" id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="syllabus">Syllabus</button>
      <button data-view="study">Revision & Study</button>
      <button data-view="tests">Tests</button>
      <button data-view="insights">Insights</button>
      <button data-view="backlog">Backlog</button>
      <button data-view="files">Files</button>
      <button data-view="settings">Settings</button>
    </div>
    <div class="exam-pill" id="examPill">JEE</div>
    <div class="user-chip hide" id="userChip"><i class="fa-solid fa-user"></i><span id="userName"></span><button onclick="doLogout()" title="Log out" style="color:var(--muted);margin-left:2px"><i class="fa-solid fa-right-from-bracket"></i></button></div>
  </div>
  <div class="container" id="views"></div>
</div>

<!-- MODAL + TOAST -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
/* ============ STORAGE ============ */
const LS='cp2028';
const SUBJECTS=['Physics','Chemistry','Maths'];
const CHECK_KEYS=[['theory','Theory'],['module','Module'],['dpp','DPP'],['mainsPyq','Mains PYQ'],['advPyq','Advance PYQ'],['extraBook','Extra Book']];
const EXAMS={
  JEE:{color:'var(--jee)',tent:'Tentative January 2028 (Main)',date:'2028-01-20',adv:'2028-05-18',advTent:'Tentative May 2028 (Advanced)'},
  CET:{color:'var(--cet)',tent:'Tentative May 2028',date:'2028-05-05'},
  Boards:{color:'var(--board)',tent:'Tentative February 2028',date:'2028-02-15'}
};
const SYL={
 Physics:{11:['Units & Measurements','Motion in a Straight Line','Motion in a Plane','Laws of Motion','Work, Energy & Power','System of Particles & Rotational Motion','Gravitation','Mechanical Properties of Solids','Mechanical Properties of Fluids','Thermal Properties of Matter','Thermodynamics','Kinetic Theory of Gases','Oscillations','Waves'],

let ac;
function beep(freq=520,dur=.12,type='sine',vol=.15){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
    o.connect(g);g.connect(ac.destination);g.gain.value=vol;
    o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ============ PARTICLES ============ */
(function(){
  const c=document.getElementById('particles'),x=c.getContext('2d');let w,h,ps=[];
  function rs(){w=c.width=innerWidth;h=c.height=innerHeight;
    ps=Array.from({length:Math.min(70,Math.floor(w/22))},()=>({x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*2+.6,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})); }
  rs();addEventListener('resize',rs);
  (function loop(){x.clearRect(0,0,w,h);
    const light=document.body.dataset.theme==='light';
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=light?'rgba(60,91,255,.35)':'rgba(140,170,255,.55)';x.fill();}
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
      const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.hypot(dx,dy);
      if(d<120){x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(ps[j].x,ps[j].y);
        x.strokeStyle=(light?'rgba(60,91,255,':'rgba(140,170,255,')+(0.12*(1-d/120))+')';x.stroke();}}
    requestAnimationFrame(loop);})();
})();

/* ============ CONFETTI ============ */
function confetti(){
  const c=document.getElementById('confetti'),x=c.getContext('2d');c.style.display='block';
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff4757','#2ed573','#3d7bff','#ffb02e','#c56bff','#7aa2ff'];
  let bits=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,
    r:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],vy:Math.random()*4+2,
    vx:(Math.random()-.5)*3,rot:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let t=0;
  (function loop(){x.clearRect(0,0,c.width,c.height);t++;
    bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.rot+=b.vr;x.save();x.translate(b.x,b.y);x.rotate(b.rot);
      x.fillStyle=b.c;x.fillRect(-b.r/2,-b.r/2,b.r,b.r*.6);x.restore();});
    if(t<160)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);c.style.display='none';}})();
}

function overallPct(){let tot=0,n=0;for(const s of SUBJECTS)for(const cl of[11,12])for(const ch of state.syllabus[s][cl]){tot+=chapterPct(ch);n++;}return n?tot/n:0;}
function subjectPct(s){let tot=0,n=0;for(const cl of[11,12])for(const ch of state.syllabus[s][cl]){tot+=chapterPct(ch);n++;}return n?tot/n:0;}

function daysTo(d){return Math.max(0,Math.ceil((new Date(d)-new Date())/864e5));}
function weakChapters(){const arr=[];for(const s of SUBJECTS)for(const cl of[11,12])for(const ch of state.syllabus[s][cl]){const p=chapterPct(ch);if(p<50)arr.push({subject:s,cl,name:ch.name,pct:p});}return arr.sort((a,b)=>a.pct-b.pct);}

    </div>
  </div>`;
  document.getElementById('modeBtns').onclick=e=>{const b=e.target.closest('button');if(b&&!tmr.run){tmr.mode=+b.dataset.m;tmr.total=tmr.left=tmr.mode*60;renderTab();}};
  document.getElementById('tStart').onclick=startTmr;

function mini(l,v){return `<div style="background:rgba(255,255,255,.04);border:1px solid var(--card-brd);border-radius:12px;padding:14px"><div class="label" style="font-size:.72rem">${l}</div><div style="font-weight:800;font-family:var(--font-h);font-size:1.3rem;margin-top:4px">${v}</div></div>`;}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function inWeek(d){const dt=new Date(d),n=new Date();const day=(n.getDay()+6)%7;const mon=new Date(n);mon.setDate(n.getDate()-day);mon.setHours(0,0,0,0);return dt>=mon;}
function startTmr(){if(tmr.run)return;tmr.run=true;beep(520,.1);
  tmr.int=setInterval(()=>{if(tmr.left<=0){stopTmr();return;}tmr.left--;const f=document.getElementById('tFace');if(f)f.textContent=fmt(tmr.left);},1000);}
function stopTmr(){tmr.run=false;clearInterval(tmr.int);const done=Math.round((tmr.total-tmr.left)/60);
  if(done>=1){state.sessions.push({id:uid(),date:todayStr(),minutes:done});save();beep(700,.15);toast('📚 Logged '+done+' min session');}
  tmr.left=tmr.total;renderTab();}

let chatHist=[];
function aiTab(){
  document.getElementById('tabBody').innerHTML=`

    </div>

function buildContext(){
  const weak=weakChapters().slice(0,8).map(w=>`${w.name} (${w.pct.toFixed(0)}%)`).join(', ');
  const due=state.revisions.filter(r=>r.status==='due'&&r.due<=todayStr()).map(r=>r.topic).slice(0,8).join(', ');
  const recent=[...state.tests].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(t=>`${t.name}: ${(+t.phy||0)+(+t.chem||0)+(+t.math||0)}/${t.total}`).join('; ');
  return `Student exam target: ${state.exam}. Exam date approx ${examDate(state.exam)} (${daysTo(examDate(state.exam))} days left).
Overall syllabus progress: ${overallPct().toFixed(0)}%. Subject-wise: ${SUBJECTS.map(s=>s+' '+subjectPct(s).toFixed(0)+'%').join(', ')}.
Weak chapters: ${weak||'none'}. Revisions due today: ${due||'none'}. Recent tests: ${recent||'none'}.
Study time today: ${fmtMin(studyMin(s=>s.date===todayStr()))}, this week: ${fmtMin(studyMin(s=>inWeek(s.date)))}.`;
}
function ruleFallback(q){
  q=q.toLowerCase();const weak=weakChapters().slice(0,4);
  if(q.includes('weak'))return weak.length?"Your weakest chapters right now:\n\n"+weak.map(w=>`• ${w.name} (${w.subject}) — ${w.pct.toFixed(0)}%`).join('\n')+"\n\nFocus a deep-study session on these!":"You're doing great — no chapters below 50% 🎉";
  if(q.includes('today')||q.includes('study'))return "Suggested plan for today:\n\n"+(weak.length?weak.slice(0,3).map((w,i)=>`${i+1}. ${w.name} — do Theory + DPP`).join('\n'):"Revise strong chapters and attempt PYQs.")+"\n\nDon't forget your due revisions!";
  if(q.includes('revision')||q.includes('due')){const d=state.revisions.filter(r=>r.status==='due'&&r.due<=todayStr());return d.length?"Due revisions:\n"+d.map(r=>'• '+r.topic).join('\n'):"No revisions due today ✅";}
  if(q.includes('progress'))return `Overall progress: ${overallPct().toFixed(0)}%\n`+SUBJECTS.map(s=>`• ${s}: ${subjectPct(s).toFixed(0)}%`).join('\n');
  return `I'm running in offline mode (no Groq key). I can still help!\nTry asking about your "weak topics", "what to study today", "due revisions" or "progress".\n\n📌 ${daysTo(examDate(state.exam))} days to your ${state.exam} exam — keep pushing!`;
}
async function sendChat(){
  const inp=document.getElementById('chatInp');const q=inp.value.trim();if(!q)return;inp.value='';
  chatHist.push({role:'user',content:q});const cb=document.getElementById('chatBox');
  cb.innerHTML+=`<div class="msg user">${q}</div><div class="msg ai" id="typing"><i class="fa-solid fa-spinner spin"></i> thinking...</div>`;cb.scrollTop=cb.scrollHeight;
  let reply;
  if(state.settings.groqKey){
    try{
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.settings.groqKey},
        body:JSON.stringify({model:'openai/gpt-oss-120b',messages:[
          {role:'system',content:'You are a friendly, motivating study coach for an Indian 11th-grade student preparing for competitive exams. Be concise, practical and encouraging. Use the student data below to personalize advice.\n\n'+buildContext()},
          ...chatHist.slice(-6)]})});
      if(!res.ok)throw new Error(res.status);
      const j=await res.json();reply=j.choices[0].message.content;
    }catch(e){reply="⚠️ Couldn't reach Groq (check your API key in Settings). Here's offline help:\n\n"+ruleFallback(q);}
  }else{reply=ruleFallback(q);}
  chatHist.push({role:'assistant',content:reply});
  document.getElementById('typing').remove();
  cb.innerHTML+=`<div class="msg ai">${reply.replace(/</g,'&lt;')}</div>`;cb.scrollTop=cb.scrollHeight;
}

function addTest(){const n=document.getElementById('tsName').value.trim();if(!n)return toast('Enter test name');

function renderAnalytics(){
  const ts=[...state.tests].sort((a,b)=>a.date.localeCompare(b.date));
  const an=document.getElementById('analytics');
  if(!ts.length){an.innerHTML=`<p style="color:var(--muted);font-size:.88rem">No tests yet. Add one to see your chart 📊</p>`;
    document.getElementById('testHist').innerHTML=`<p style="color:var(--muted);font-size:.88rem">Empty.</p>`;
    document.getElementById('rankSim').innerHTML=`<p style="color:var(--muted);font-size:.88rem">Add a test to simulate rank.</p>`;return;}
  const scores=ts.map(score);const max=Math.max(...scores,1);const latest=scores[scores.length-1];
  const avg=scores.reduce((a,b)=>a+b,0)/scores.length;const best=Math.max(...scores);
  an.innerHTML=`<div class="grid g3" style="gap:10px;margin-bottom:16px">
    ${mini('Latest',latest)}${mini('Average',avg.toFixed(0))}${mini('Best',best)}</div>
    <div class="chart">${ts.map((t,i)=>`<div class="col"><div class="bar-v" style="height:${scores[i]/max*100}%"><span>${scores[i]}</span></div><div class="cl">${t.name.slice(0,8)}</div></div>`).join('')}</div>`;
  document.getElementById('testHist').innerHTML=[...ts].reverse().map(t=>`<div class="li">
    <div class="grow"><b>${t.name}</b> <span class="tag done">${score(t)}/${t.total}</span><br>
    <small>${t.date} • P:${t.phy} C:${t.chem} M:${t.math}${t.port?' • '+t.port:''}${t.prep?' • prep '+t.prep+'%':''}</small></div>
    <button class="btn sm danger" onclick="delTest('${t.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('');
  const last=ts[ts.length-1];const pctScore=score(last)/last.total;
  const percentile=Math.min(99.99,Math.max(1,pctScore*100*0.99+ (pctScore>0.8?0.9:0))).toFixed(2);
  const totalCand=1000000;const rank=Math.max(1,Math.round((100-percentile)/100*totalCand));
  document.getElementById('rankSim').innerHTML=`
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:12px">Based on your latest test "<b style="color:var(--txt)">${last.name}</b>" (${score(last)}/${last.total})</p>
    <div class="grid g2" style="gap:12px">${mini('Est. Percentile',percentile+' %ile')}${mini('Est. Rank (of ~10L)',rank.toLocaleString('en-IN'))}</div>
    <p style="color:var(--muted);font-size:.78rem;margin-top:12px">*Rough estimate for motivation only — real ranks depend on normalization & difficulty.</p>`;
}

      <div class="field" style="margin-top:16px"><label>Remove an existing chapter</label>
        <div class="row"><select id="msDel" style="flex:1"></select>
        <button class="btn danger" onclick="removeChapter()"><i class="fa-solid fa-trash"></i> Remove</button></div></div></div>
    <div class="card"><div class="label" style="margin-bottom:14px"><i class="fa-solid fa-calendar-days"></i> Exam Dates</div>
      <div class="field"><label>JEE Main / primary exam date</label><input type="date" id="edJEE" value="${examDate('JEE')}"></div>
      <div class="field"><label>JEE Advanced date</label><input type="date" id="edJEEadv" value="${examAdv('JEE')}"></div>
      <div class="row"><div class="field" style="flex:1"><label>CET date</label><input type="date" id="edCET" value="${examDate('CET')}"></div>
      <div class="field" style="flex:1"><label>Boards date</label><input type="date" id="edBoards" value="${examDate('Boards')}"></div></div>
      <button class="btn" onclick="saveExamDates()"><i class="fa-solid fa-floppy-disk"></i> Save Dates</button>
      <p style="color:var(--muted);font-size:.78rem;margin-top:10px">The Dashboard countdown updates automatically.</p></div>
    <div class="card"><div class="label" style="margin-bottom:14px"><i class="fa-solid fa-cloud"></i> Cloud Sync (Firebase)</div>
      <p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">Status: <b style="color:${cloudOn()?'var(--green)':'var(--muted)'}">${cloudOn()?(currentUser?'Signed in as '+((state.profile&&state.profile.username)||currentUser.email):'Configured — sign in to sync'):'Not configured'}</b></p>
      <div class="field"><label>Paste your Firebase config to enable login &amp; sync</label><textarea id="fbCfg" rows="6" placeholder='apiKey: "AIza...", authDomain: "xxx.firebaseapp.com", projectId: "xxx", storageBucket: "...", messagingSenderId: "...", appId: "..."'>${localStorage.getItem('cp2028_fb')?JSON.stringify(JSON.parse(localStorage.getItem('cp2028_fb')),null,2):''}</textarea></div>
      <div class="row"><button class="btn" onclick="saveFbConfig()"><i class="fa-solid fa-floppy-disk"></i> Save &amp; Enable</button>${currentUser?`<button class="btn ghost" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>`:''}</div>
      <p style="color:var(--muted);font-size:.76rem;margin-top:10px">These keys are safe to store client-side; per-user security is enforced by Firestore rules.</p></div>
    <div class="card"><div class="label" style="margin-bottom:14px"><i class="fa-solid fa-database"></i> Data Backup</div>
      <div class="row"><button class="btn ghost" onclick="exportData()"><i class="fa-solid fa-download"></i> Export JSON</button>
      <button class="btn ghost" onclick="document.getElementById('impFile').click()"><i class="fa-solid fa-upload"></i> Import JSON</button>
      <button class="btn danger" onclick="clearData()"><i class="fa-solid fa-trash"></i> Clear All</button></div>
      <input type="file" id="impFile" accept=".json" class="hide" onchange="importData(event)"></div>
  </div>`;}
function setInit(){fillMsDel();const a=document.getElementById('msSub'),b=document.getElementById('msCl');if(a)a.onchange=fillMsDel;if(b)b.onchange=fillMsDel;}
function fillMsDel(){const sel=document.getElementById('msDel');if(!sel)return;const s=document.getElementById('msSub').value,cl=+document.getElementById('msCl').value;
  sel.innerHTML=state.syllabus[s][cl].map((ch,i)=>`<option value="${i}">${ch.name}</option>`).join('');}
function removeChapter(){const s=document.getElementById('msSub').value,cl=+document.getElementById('msCl').value,i=+document.getElementById('msDel').value;
  if(isNaN(i)||!state.syllabus[s][cl][i])return toast('No chapter selected');const nm=state.syllabus[s][cl][i].name;
  openModal(`<h3>Remove chapter? <span class="x" onclick="closeModal()">×</span></h3><p style="color:var(--muted);margin-bottom:18px">Delete "<b style="color:var(--txt)">${nm}</b>" from ${s} Class ${cl}? This also removes its progress.</p>
  <div class="row"><button class="btn danger" onclick="doRemoveChapter('${s}',${cl},${i})">Yes, remove</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function doRemoveChapter(s,cl,i){const nm=state.syllabus[s][cl][i].name;state.syllabus[s][cl].splice(i,1);save();beep(300,.1,'sine',.12);closeModal();fillMsDel();toast('🗑️ Removed '+nm);}
function saveExamDates(){state.examDates={JEE:{date:document.getElementById('edJEE').value,adv:document.getElementById('edJEEadv').value},
  CET:{date:document.getElementById('edCET').value},Boards:{date:document.getElementById('edBoards').value}};
  save();okSound();toast('📅 Exam dates updated');}
function saveTarget(){state.settings.dailyTarget=+document.getElementById('setTarget').value||4;save();toast('🎯 Target saved');}
function saveGroq(){state.settings.groqKey=document.getElementById('setGroq').value.trim();save();toast('🔑 Groq key saved');}
async function testGroq(){const k=document.getElementById('setGroq').value.trim();if(!k)return toast('❌ Enter a key first');toast('<i class="fa-solid fa-spinner spin"></i> Testing...');
  try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
    body:JSON.stringify({model:'openai/gpt-oss-120b',messages:[{role:'user',content:'hi'}],max_tokens:5})});
    if(r.ok){state.settings.groqKey=k;save();okSound();toast('✅ Groq API activated!');}
    else{const j=await r.json().catch(()=>({}));toast('❌ Failed — '+((j.error&&j.error.message)||('HTTP '+r.status)));}
  }catch(e){toast('❌ Failed — network/CORS error');}}
function addChapter(){const s=document.getElementById('msSub').value,cl=+document.getElementById('msCl').value,nm=document.getElementById('msChap').value.trim();
  if(!nm)return toast('Enter chapter name');state.syllabus[s][cl].push({id:uid(),name:nm,topics:[{id:uid(),name:nm,checks:{}}]});save();okSound();fillMsDel();toast('Chapter added to '+s);document.getElementById('msChap').value='';}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='career-path-2028-backup-'+todayStr()+'.json';a.click();toast('📦 Exported');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);save();toast('✅ Data imported');render('dashboard');}catch(x){toast('❌ Invalid file');}};r.readAsText(f);}
function clearData(){openModal(`<h3>Clear all data? <span class="x" onclick="closeModal()">×</span></h3>
  <p style="color:var(--muted);margin-bottom:18px">This permanently deletes all your progress, tests, revisions and files. Export a backup first!</p>
  <div class="row"><button class="btn danger" onclick="doClear()">Yes, delete everything</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function doClear(){localStorage.removeItem(LS);idbClear();state=load();closeModal();toast('🗑️ All data cleared');goLanding();}

/* ============ FILE MANAGER (IndexedDB) ============ */
function filesView(){return `<div class="page-title">File Manager</div><div class="page-sub">Upload notes, PDFs & images — organized by Subject → Chapter → Topic</div>
  <div class="card"><div class="row" style="margin-bottom:14px;align-items:flex-end">
    <div class="field" style="flex:1;margin:0"><label>Subject</label><input id="fSub" placeholder="Physics"></div>
    <div class="field" style="flex:1;margin:0"><label>Chapter</label><input id="fChap" placeholder="Kinematics"></div>
    <div class="field" style="flex:1;margin:0"><label>Topic</label><input id="fTopic" placeholder="Projectile"></div>
    <button class="btn" onclick="document.getElementById('upFile').click()"><i class="fa-solid fa-upload"></i> Upload</button>
    <input type="file" id="upFile" class="hide" onchange="uploadFile(event)"></div>
    <div id="fileTree"></div></div>`;}
function filesInit(){renderFiles();}
let db;
function idbOpen(){return new Promise(res=>{const r=indexedDB.open('cp2028files',1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore('files',{keyPath:'id'});};
  r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=()=>res(null);});}
async function idbPut(o){await idbOpen();return new Promise(res=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(o);t.oncomplete=res;});}
async function idbGet(id){await idbOpen();return new Promise(res=>{const r=db.transaction('files','readonly').objectStore('files').get(id);r.onsuccess=()=>res(r.result);});}
async function idbDel(id){await idbOpen();return new Promise(res=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=res;});}
async function idbClear(){await idbOpen();return new Promise(res=>{const t=db.transaction('files','readwrite');t.objectStore('files').clear();t.oncomplete=res;});}
function uploadFile(e){const f=e.target.files[0];if(!f)return;
  const sub=document.getElementById('fSub').value.trim()||'General',ch=document.getElementById('fChap').value.trim()||'Misc',tp=document.getElementById('fTopic').value.trim()||'—';
  const r=new FileReader();r.onload=async()=>{const id=uid();await idbPut({id,data:r.result,type:f.type,name:f.name});
    state.files.push({id,name:f.name,sub,ch,tp,type:f.type});save();okSound();renderFiles();toast('📎 '+f.name+' uploaded');};r.readAsDataURL(f);}
async function openFile(id){const rec=await idbGet(id);if(!rec)return toast('File missing');clickSound();
  try{const arr=rec.data.split(',');const mime=(arr[0].match(/:(.*?);/)||[])[1]||rec.type||'application/octet-stream';
    const bstr=atob(arr[1]);let n=bstr.length;const u8=new Uint8Array(n);while(n--)u8[n]=bstr.charCodeAt(n);
    const url=URL.createObjectURL(new Blob([u8],{type:mime}));window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(err){const w=window.open();if(w)w.location=rec.data;else toast('Allow pop-ups to open files');}}
function delFile(id){idbDel(id);state.files=state.files.filter(f=>f.id!==id);save();renderFiles();toast('Deleted');}
function renderFiles(){const el=document.getElementById('fileTree');if(!el)return;
  if(!state.files.length){el.innerHTML=`<p style="color:var(--muted);font-size:.88rem">No files yet. Upload PDFs or images with subject/chapter/topic tags — they're organized into folders below.</p>`;return;}
  const tree={};state.files.forEach(f=>{tree[f.sub]=tree[f.sub]||{};tree[f.sub][f.ch]=tree[f.sub][f.ch]||[];tree[f.sub][f.ch].push(f);});
  el.innerHTML=Object.entries(tree).map(([sub,chs])=>`<div class="folder">
    <div class="folder-h" onclick="this.nextElementSibling.classList.toggle('hide')"><i class="fa-solid fa-folder" style="color:var(--yellow)"></i> ${sub} <small style="color:var(--muted)">(${Object.values(chs).flat().length})</small></div>
    <div>${Object.entries(chs).map(([ch,files])=>`<div style="padding:6px 15px 6px 30px;font-weight:600;font-size:.84rem;color:var(--muted)"><i class="fa-solid fa-folder-open"></i> ${ch}</div>
      ${files.map(f=>`<div class="file-row"><i class="fa-solid ${f.type.includes('pdf')?'fa-file-pdf':f.type.startsWith('image')?'fa-file-image':'fa-file'}" style="color:var(--accent)"></i>
        <span class="grow">${f.name} <small>· ${f.tp}</small></span>
        <button class="btn sm ghost" onclick="openFile('${f.id}')">Open</button>
        <button class="btn sm danger" onclick="delFile('${f.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('')}`).join('')}</div>
  </div>`).join('');}

/* ============ THEME & NAV ============ */
function applyTheme(){document.body.dataset.theme=state.theme;document.getElementById('themeToggle').textContent=state.theme==='dark'?'🌙':'☀️';}
document.getElementById('themeToggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();clickSound();};
function enterApp(exam){state.exam=exam;save();
  document.getElementById('landing').classList.add('hide');document.getElementById('app').classList.remove('hide');
  document.getElementById('examPill').textContent=exam;document.getElementById('examPill').style.color=EXAMS[exam].color;
  showUser();render('dashboard');}
function goLanding(){document.getElementById('app').classList.add('hide');document.getElementById('landing').classList.remove('hide');}
document.querySelectorAll('.exam-card').forEach(c=>{c.addEventListener('mouseenter',hoverSound);
  c.addEventListener('click',()=>{clickSound();setTimeout(()=>enterApp(c.dataset.exam),120);});});

/* ============ PWA ============ */
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.classList.remove('hide');});
document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return toast('Use your browser menu → "Install app"');
  deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').classList.add('hide');};
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.add('hide');toast('✅ Installed! Open it from your home screen.');});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

/* ============ AUTH + CLOUD SYNC (Firebase) ============ */
/* ===== PASTE YOUR FIREBASE CONFIG BELOW (or use Settings → Cloud Sync) ===== */
const FIREBASE_CONFIG={
  apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:""
};
/* ========================================================================== */
let fbAuth=null,fbDb=null,currentUser=null,cloudTimer=null,authMode='login';
function fbConfig(){let c={...FIREBASE_CONFIG};try{const o=JSON.parse(localStorage.getItem('cp2028_fb')||'null');if(o&&o.apiKey)c=o;}catch(e){}return c;}
function cloudOn(){const c=fbConfig();return !!(window.firebase&&c.apiKey&&c.projectId);}
function initFirebase(){
  if(!cloudOn())return false;
  try{if(!firebase.apps.length)firebase.initializeApp(fbConfig());
    fbAuth=firebase.auth();fbDb=firebase.firestore();
    fbAuth.onAuthStateChanged(onAuthChanged);return true;
  }catch(e){console.warn('Firebase init failed',e);return false;}
}
function switchAuth(m){authMode=m;
  document.getElementById('tabLogin').classList.toggle('active',m==='login');
  document.getElementById('tabSignup').classList.toggle('active',m==='signup');
  document.getElementById('unameField').style.display=m==='signup'?'block':'none';
  document.getElementById('auBtn').innerHTML=m==='signup'?'<i class="fa-solid fa-user-plus"></i> Create Account':'<i class="fa-solid fa-right-to-bracket"></i> Log In';
  document.getElementById('auErr').textContent='';clickSound();}
async function submitAuth(){
  const email=document.getElementById('auEmail').value.trim(),pass=document.getElementById('auPass').value,err=document.getElementById('auErr');
  err.textContent='';if(!email||!pass)return err.textContent='Enter your email and password.';
  const btn=document.getElementById('auBtn');const old=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-spinner spin"></i> Please wait...';
  try{
    if(authMode==='signup'){
      const name=document.getElementById('auName').value.trim()||email.split('@')[0];
      const cred=await fbAuth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName:name});
      if(!state.profile)state.profile={};state.profile.username=name;localStorage.setItem(LS,JSON.stringify(state));
    }else{await fbAuth.signInWithEmailAndPassword(email,pass);}
    okSound();
  }catch(e){btn.innerHTML=old;err.textContent=authError(e);}
}
function authError(e){const m=(e&&e.code)||'';
  if(m.includes('email-already-in-use'))return 'That email is already registered — try logging in.';
  if(m.includes('invalid-email'))return 'That email address looks invalid.';
  if(m.includes('weak-password'))return 'Password should be at least 6 characters.';
  if(m.includes('wrong-password')||m.includes('invalid-credential'))return 'Wrong email or password.';
  if(m.includes('user-not-found'))return 'No account with that email — sign up first.';
  if(m.includes('network'))return 'Network error — check your connection.';
  if(m.includes('operation-not-allowed'))return 'Enable Email/Password in Firebase console first.';
  return (e&&e.message)||'Something went wrong.';}
async function onAuthChanged(user){
  if(user){currentUser=user;
    try{const doc=await fbDb.collection('users').doc(user.uid).get();
      if(doc.exists&&doc.data()&&doc.data().state){state=applyDefaults(doc.data().state);localStorage.setItem(LS,JSON.stringify(state));toast('☁️ Synced from cloud');}
      else{if(!state.profile)state.profile={};state.profile.username=user.displayName||state.profile.username||'';localStorage.setItem(LS,JSON.stringify(state));await pushCloud();}
    }catch(e){console.warn('cloud pull failed',e);toast('⚠️ Cloud sync issue — using local data');}
    applyTheme();showUser();
    document.getElementById('authScreen').classList.add('hide');
    document.getElementById('landing').classList.remove('hide');
  }else{currentUser=null;
    document.getElementById('app').classList.add('hide');
    document.getElementById('landing').classList.add('hide');
    document.getElementById('userChip').classList.add('hide');
    document.getElementById('authScreen').classList.remove('hide');
  }
}
function showUser(){const c=document.getElementById('userChip');if(!currentUser){c.classList.add('hide');return;}
  document.getElementById('userName').textContent=(state.profile&&state.profile.username)||currentUser.email;c.classList.remove('hide');}
async function doLogout(){clickSound();try{await pushCloud();await fbAuth.signOut();}catch(e){}toast('👋 Logged out');}
function scheduleCloudPush(){if(!currentUser||!fbDb)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1500);}
async function pushCloud(){if(!currentUser||!fbDb)return;
  try{await fbDb.collection('users').doc(currentUser.uid).set({username:(state.profile&&state.profile.username)||'',state:state,updated:Date.now()},{merge:true});}catch(e){console.warn('push failed',e);}}
function parseFbConfig(txt){txt=(txt||'').trim();
  try{if(txt.startsWith('{'))return JSON.parse(txt);}catch(e){}
  const keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];const o={};
  keys.forEach(k=>{let m=txt.match(new RegExp(k+'\\s*:\\s*"([^"]+)"'))||txt.match(new RegExp(k+"\\s*:\\s*'([^']+)'"));if(m)o[k]=m[1];});
  return o;}
function saveFbConfig(){const o=parseFbConfig(document.getElementById('fbCfg').value);
  if(!o.apiKey||!o.projectId)return toast('❌ Could not read apiKey/projectId — paste the whole config');
  localStorage.setItem('cp2028_fb',JSON.stringify(o));okSound();toast('✅ Cloud enabled! Reloading...');setTimeout(()=>location.reload(),900);}

/* ============ INIT ============ */
applyTheme();
if(cloudOn()){
  document.getElementById('landing').classList.add('hide');
  document.getElementById('authScreen').classList.remove('hide');
  switchAuth('login');initFirebase();
}
</script>
</body>
